name: Bug report
description: Report a reproducible defect in UTSAV AI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve UTSAV AI. Please search existing issues before opening a new one.

        **Do not include API keys, `.env` contents, other credentials, guest names, notes, dietary or accessibility details, or exported workspace files.** Report security vulnerabilities privately using [SECURITY.md](https://github.com/siddhant19saraf-spec/utsav-ai/blob/main/SECURITY.md), not a public issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability or a request for credentials.
          required: true
        - label: I am using synthetic or sample data in this report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the application or repository does this concern?
      options:
        - Workspace and event management
        - Budget Planner or repair proposal
        - Event Rescue analysis or approval
        - Timeline or preparation tasks
        - Guests, RSVP, or catering estimate
        - Risk Intelligence
        - AI Planner (deterministic outline)
        - AI Planner (provider request or API server)
        - Persistence, export, or import
        - Accessibility or responsive layout
        - CI, tests, or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, including the sample event and values used.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include safe error messages or console excerpts. Remove any secrets or personal data.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, and Node.js version if the API server is involved.
      placeholder: Chrome 142 on Windows 11; Node.js 24.16.0
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs (optional)
      description: Drag in images or paste safe text. Do not include credentials or real guest information.

  - type: checkboxes
    id: privacy
    attributes:
      label: Data and privacy confirmation
      options:
        - label: This report contains no credentials, secrets, real guest data, or private planning information.
          required: true
