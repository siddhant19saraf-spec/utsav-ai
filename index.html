<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#4a1325" />
    <meta
      name="description"
      content="UTSAV AI is a celebration and event planning workspace. Plan smarter. Celebrate better with events, budgets, tasks, and planning progress in one calm dashboard."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('utsav-ai.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = preference === 'dark' || (preference !== 'light' && prefersDark);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          // Theme preference is optional; the app still renders with the light theme.
        }
      })();
    </script>
    <title>UTSAV AI · Celebration &amp; Event Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>UTSAV AI requires JavaScript to display this page.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
